name: Build Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build executable package
        run: pyinstaller --noconfirm --clean --console --onedir --contents-directory . --name KUIN-G --hidden-import=tools.dashboard_server --hidden-import=tools.create_dashboard_data --hidden-import=src.generate_UIDS --add-data "dashboard;dashboard" --add-data "input;input" --add-data "output;output" --add-data "qr_codes;qr_codes" UID.py

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: KUIN-G-Windows
          path: dist/KUIN-G
          if-no-files-found: error
